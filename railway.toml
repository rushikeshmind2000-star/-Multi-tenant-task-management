# Railway deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Tell Railway to use our Dockerfile
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway monitors process health automatically
# No /actuator/health needed unless you add spring-boot-actuator dependency
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
