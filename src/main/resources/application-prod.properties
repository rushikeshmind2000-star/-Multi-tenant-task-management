# ═══════════════════════════════════════════════════════════
#  PROD Profile — Cloud / Railway Deployment
#  ✅  Safe to commit — all values come from ENV VARIABLES
#  Set these in Railway dashboard:
#    DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET
# ═══════════════════════════════════════════════════════════

# ─── MySQL Database (from Railway MySQL plugin) ───────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ─── JPA / Hibernate (quiet in prod) ─────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── JWT Secret (from Railway env var) ───────────────────
jwt.secret=${JWT_SECRET}
