spring.application.name=multi-tenant-task-management

# ─────────────────────────────────────────────────────────
#  Active Profile — switches between dev / prod config
#  Override this on Railway/cloud via environment variable:
#    SPRING_PROFILES_ACTIVE=prod
# ─────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Shared / Non-secret Settings ────────────────────────

# DB Driver (same for all environments)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Port (Railway overrides this via PORT env var)
server.port=${PORT:8080}
