spring.application.name=multi-tenant-task-management

# ─── Database ─────────────────────────────────────────────
# Uses Railway MySQL env vars when deployed; falls back to local defaults.
# Local dev: override these in application-dev.properties (gitignored).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:techplus}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Rushee@2002}

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── JWT ──────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Server Port ──────────────────────────────────────────
# Railway injects PORT automatically; defaults to 8080 locally
server.port=${PORT:8080}
