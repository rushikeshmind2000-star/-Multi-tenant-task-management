spring.application.name=multi-tenant-task-management

# ─────────────────────────────────────────────────────────
#  Active Profile — switches between dev / prod config
#  Override this on Railway/cloud via environment variable:
#    SPRING_PROFILES_ACTIVE=prod
# ─────────────────────────────────────────────────────────
spring.profiles.active=dev

# ─── Shared / Non-secret Settings ────────────────────────

# DB Driver (same for all environments)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# JWT expiration (24 hours — same for all envs)
jwt.expiration=86400000

# Server Port (Railway overrides this via PORT env var)
server.port=${PORT:8080}
